<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero de Seguimiento de IA — Antigravity Harness SDD</title>

  <!-- Inicialización inmediata de tema para evitar FOUC -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('harness_theme') || 'dark';
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>

  <!-- Tailwind CSS v4 Browser Runtime -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Three.js (para la Constelación 3D) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));

    @theme {
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>

  <style>
    html {
      color-scheme: light dark;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    html.dark {
      color-scheme: dark;
    }
    html:not(.dark) {
      color-scheme: light;
    }
    html:not(.dark) body {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    html.dark body {
      background-color: #020617 !important;
      color: #f8fafc !important;
    }
  </style>

  <!-- Mermaid.js Runtime para Renderizado Interactivo de Diagramas C4 y UML -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <!-- Datos de inicialización y fallback para compatibilidad con protocolo file:/// y offline -->
  <script src="./data-fallback.js"></script>
</head>
<body class="h-full antialiased overflow-x-hidden transition-colors duration-200">
  <!-- Contenedor Raíz de la Aplicación -->
  <div id="app"></div>

  <!-- Ejecutable bundle universal (compatible con file:/// y http://) -->
  <script src="./dist/app.bundle.js"></script>
</body>
</html>

project:
  name: contextforge
  description: ContextForge - Local Knowledge RAG, Sovereign Docs-as-Code & Reusable SDD Governance Engine
  version: 1.0.0
  type: fullstack

runtime:
  language: python
  version: ">=3.11"
  packageManager: uv

checks:
  build:
    command: .\.venv\Scripts\python.exe -m mypy --strict src
    timeout: 60
  test:
    command: .\.venv\Scripts\python.exe -m pytest
    timeout: 180
    hasTests: true
  lint:
    command: .\.venv\Scripts\python.exe -m mypy --strict src
    hasLint: true

docker:
  hasDockerfile: true
  hasCompose: true
  composePath: docker-compose.yml
  services:
    - name: contextforge
      port: 8000

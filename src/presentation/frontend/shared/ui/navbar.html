<header class="sticky top-0 z-50 w-full border-b border-slate-800 bg-slate-900/95 backdrop-blur">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo & Brand -->
      <div class="flex items-center space-x-3">
        <a href="/docs/browser" class="flex items-center space-x-2 text-xl font-bold tracking-tight text-white hover:text-indigo-400 transition">
          <span class="w-9 h-9 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-400 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
            <i class="fa-solid fa-brain text-base"></i>
          </span>
          <span class="bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">ContextForge</span>
        </a>
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
          Local RAG
        </span>
      </div>

      <!-- Navigation Links -->
      <nav class="hidden md:flex items-center space-x-1">
        <a href="/docs/browser" class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
          <i class="fa-solid fa-book-bookmark mr-1.5 text-indigo-400"></i>Docs
        </a>
        <a href="/chat" class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
          <i class="fa-solid fa-comments mr-1.5 text-indigo-400"></i>Chat RAG
        </a>
        <a href="/bundles" class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
          <i class="fa-solid fa-box-archive mr-1.5 text-indigo-400"></i>Bundler
        </a>
        <a href="/projects" class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
          <i class="fa-solid fa-diagram-project mr-1.5 text-indigo-400"></i>Proyectos
        </a>
        <a href="/settings" class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition">
          <i class="fa-solid fa-sliders mr-1.5 text-indigo-400"></i>Config
        </a>
      </nav>

      <!-- Right Actions: Project Switcher, Command Palette & New Doc -->
      <div class="flex items-center space-x-3">
        <!-- Global Project Switcher Dropdown (HTMX Loaded) -->
        <div id="navbar-project-container" hx-get="/ui/projects/navbar-selector" hx-trigger="load" hx-swap="innerHTML">
          <span class="text-xs text-slate-500 font-mono">Cargando proyecto...</span>
        </div>

        <!-- Command Palette Trigger (Ctrl+K) -->
        <button 
          onclick="window.toggleCommandPalette && window.toggleCommandPalette()"
          class="hidden sm:inline-flex items-center space-x-1.5 px-2.5 py-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 text-xs text-slate-400 hover:text-white transition shadow-sm"
          title="Buscar rápidamente o ejecutar comandos (Ctrl+K)"
        >
          <i class="fa-solid fa-magnifying-glass text-slate-400 text-[11px]"></i>
          <span>Buscar...</span>
          <kbd class="ml-1 px-1.5 py-0.5 text-[10px] font-mono bg-slate-900 border border-slate-700 rounded text-slate-400">Ctrl K</kbd>
        </button>

        <!-- Editor Dual CTA Button -->
        <a href="/books/editor" class="hidden md:inline-flex items-center justify-center px-3 py-1.5 text-xs font-semibold text-indigo-300 bg-indigo-950/70 hover:bg-indigo-900/80 border border-indigo-500/30 rounded-lg transition shadow-sm" title="Editor Dual (Markdown Pro + Bloques)">
          <i class="fa-solid fa-cubes mr-1.5"></i>Editor Dual
        </a>

        <!-- CTA Button -->
        <a href="/docs/new" class="inline-flex items-center justify-center px-3.5 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg shadow-md shadow-indigo-600/20 transition">
          <i class="fa-solid fa-plus mr-1.5"></i>Nuevo Doc
        </a>
      </div>

    </div>
  </div>
</header>

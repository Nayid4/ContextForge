{# Reusable Empty State Macro #}
{% macro empty_state(icon_class, title, subtitle, cta_href='', cta_label='') %}
<div class="rounded-xl border border-dashed border-slate-800 p-10 text-center bg-slate-900/20">
  <i class="{{ icon_class }} text-3xl text-slate-500 mb-3"></i>
  <p class="text-sm text-slate-300 font-medium">{{ title }}</p>
  <p class="text-xs text-slate-500 mt-1">{{ subtitle }}</p>
  {% if cta_href and cta_label %}
  <div class="mt-4">
    <a href="{{ cta_href }}" class="inline-flex items-center space-x-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition">
      <i class="fa-solid fa-plus"></i>
      <span>{{ cta_label }}</span>
    </a>
  </div>
  {% endif %}
</div>
{% endmacro %}

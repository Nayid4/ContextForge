{# Reusable Page Header Macro #}
{% macro page_header(icon_class, title, subtitle, badge_text='', icon_color='indigo') %}
<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 border-b border-slate-800 pb-6">
  <div>
    <div class="flex items-center space-x-3">
      <span class="w-10 h-10 rounded-xl bg-{{ icon_color }}-500/10 border border-{{ icon_color }}-500/20 flex items-center justify-center text-{{ icon_color }}-400 shrink-0">
        <i class="{{ icon_class }} text-lg"></i>
      </span>
      <div>
        <div class="flex items-center flex-wrap gap-2">
          <h1 class="text-2xl font-bold tracking-tight text-white">{{ title }}</h1>
          {% if badge_text %}
          <span class="px-2 py-0.5 rounded text-xs font-mono font-semibold bg-{{ icon_color }}-500/10 text-{{ icon_color }}-400 border border-{{ icon_color }}-500/20">
            {{ badge_text }}
          </span>
          {% endif %}
        </div>
        <p class="text-sm text-slate-400 mt-0.5">{{ subtitle }}</p>
      </div>
    </div>
  </div>
  {% if caller is defined %}
  <div class="flex items-center flex-wrap gap-3">
    {{ caller() }}
  </div>
  {% endif %}
</div>
{% endmacro %}

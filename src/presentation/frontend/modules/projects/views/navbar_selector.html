<div class="relative flex items-center">
  <form id="project-switch-form" class="m-0 p-0">
    <div class="relative flex items-center">
      <span class="absolute left-2.5 text-slate-400 pointer-events-none text-xs">
        <i class="fa-solid fa-folder-tree text-indigo-400"></i>
      </span>
      <select 
        name="project_slug"
        id="global-project-select"
        class="bg-slate-800/90 hover:bg-slate-800 text-slate-200 text-xs font-medium rounded-lg pl-7 pr-7 py-1.5 border border-slate-700/80 focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500 appearance-none cursor-pointer transition shadow-sm"
        hx-post="/ui/projects/switch"
        hx-trigger="change"
        hx-swap="none"
        title="Seleccionar proyecto activo de ingeniería"
      >
        {% for p in projects %}
        <option value="{{ p.slug.value }}" {% if p.slug.value == active_slug %}selected{% endif %}>
          {{ p.name }} ({{ p.slug.value }})
        </option>
        {% endfor %}
      </select>
      <span class="absolute right-2.5 text-slate-400 pointer-events-none text-[10px]">
        <i class="fa-solid fa-chevron-down"></i>
      </span>
    </div>
  </form>
</div>

{# Reusable Engine Card Component for Settings View (Alpine.js reactive) #}
<div 
  @click="selectEngine(c)"
  :class="{
    'border-indigo-500 bg-indigo-500/15 shadow-xl shadow-indigo-500/20 ring-2 ring-indigo-500 scale-[1.01]': selectedProvider === c.provider,
    'border-slate-800 bg-slate-900/40 hover:border-slate-700 hover:bg-slate-800/40': selectedProvider !== c.provider
  }"
  class="relative flex flex-col justify-between p-4 rounded-2xl border cursor-pointer select-none transition-all duration-200 transform"
>
  <div>
    <!-- Engine Category Badge & Active Indicator -->
    <div class="flex items-center justify-between mb-3 gap-2">
      <span 
        :class="{
          'bg-amber-500/10 text-amber-400 border-amber-500/20': c.engine_type === 'local_http',
          'bg-sky-500/10 text-sky-400 border-sky-500/20': c.engine_type === 'cloud_api',
          'bg-emerald-500/10 text-emerald-400 border-emerald-500/20': c.engine_type === 'local_cli'
        }"
        class="text-[10px] font-mono px-2 py-0.5 rounded border uppercase"
        x-text="c.engine_type === 'local_http' ? 'Servidor Local' : (c.engine_type === 'local_cli' ? 'Agente CLI' : 'Cloud API')"
      ></span>

      <div class="flex items-center gap-1.5">
        <template x-if="c.engine_type === 'local_cli' && isCliDetected(c.provider)">
          <span class="px-1.5 py-0.5 rounded text-[9px] font-mono bg-teal-500/15 text-teal-300 border border-teal-500/30" title="Binario detectado en PATH">
            PATH ✓
          </span>
        </template>
        <div x-show="activeProvider === c.provider">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block animate-pulse" title="Proveedor Activo"></span>
        </div>
      </div>
    </div>

    <!-- Title & Icon -->
    <div class="flex items-center space-x-2.5 mb-1.5">
      <span class="text-xl shrink-0" x-text="getEngineIcon(c.provider)"></span>
      <h3 class="font-bold text-sm text-white truncate" x-text="c.name"></h3>
    </div>

    <!-- Model or CLI Binary Subtitle -->
    <div class="mt-2 text-[11px] font-mono text-indigo-300 truncate">
      <template x-if="c.engine_type === 'local_cli'">
        <span x-text="`$ ${c.cli_command || c.provider} (${c.default_model})`"></span>
      </template>
      <template x-if="c.engine_type !== 'local_cli'">
        <span x-text="c.default_model"></span>
      </template>
    </div>
  </div>

  <!-- Bottom Status Pill -->
  <div class="mt-3 pt-2 border-t border-slate-800/60 flex items-center justify-between text-[10px]">
    <span class="text-zinc-400" x-text="c.is_active ? 'Motor Activo' : 'Disponible'"></span>
    <span 
      :class="c.is_active ? 'text-emerald-400 font-semibold' : 'text-zinc-500'" 
      x-text="c.is_active ? '● EN USO' : '○ Standby'"
    ></span>
  </div>
</div>

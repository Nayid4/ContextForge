      <!-- Right Column: Format, Live Token Meter & Compile Action -->
      <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-5 space-y-5 shadow-xs h-fit sticky top-16">
        <h2 class="text-sm font-semibold text-slate-900 dark:text-white flex items-center space-x-2 border-b border-slate-100 dark:border-slate-800 pb-3">
          <i class="fa-solid fa-sliders text-indigo-500 dark:text-indigo-400"></i>
          <span>2. Formato y presupuesto</span>
        </h2>

        <!-- Live Selection Budget Meter (Nielsen H#1 & H#5) -->
        <div class="rounded-xl bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 p-3 space-y-2">
          <div class="flex items-center justify-between text-[11px]">
            <span class="text-slate-500 dark:text-slate-400 font-medium">Estimación actual</span>
            <span id="cf-selected-tokens-label" class="font-mono font-semibold text-slate-800 dark:text-slate-200">0 tokens</span>
          </div>
          <div class="w-full h-1.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
            <div id="cf-token-progress-bar" class="h-full rounded-full bg-emerald-500 transition-all duration-200" style="width: 0%;"></div>
          </div>
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300">Formato de salida</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center space-x-2 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/70 hover:border-indigo-400 cursor-pointer text-xs">
              <input type="radio" name="export_format" value="markdown" {% if export_format != 'cursorrules' %}checked{% endif %} class="text-indigo-600 focus:ring-indigo-500">
              <span class="font-medium text-slate-800 dark:text-slate-200">Markdown</span>
            </label>
            <label class="flex items-center space-x-2 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/70 hover:border-indigo-400 cursor-pointer text-xs">
              <input type="radio" name="export_format" value="cursorrules" {% if export_format == 'cursorrules' %}checked{% endif %} class="text-indigo-600 focus:ring-indigo-500">
              <span class="font-medium text-indigo-700 dark:text-indigo-300">.cursorrules</span>
            </label>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between text-xs mb-1.5">
            <span class="text-slate-700 dark:text-slate-300 font-medium">Límite de tokens</span>
            <span id="token-display" class="font-bold text-indigo-600 dark:text-indigo-400 font-mono">{{ "{:,}".format(max_tokens) }} tokens</span>
          </div>
          <input
            type="range"
            id="token-slider"
            name="max_tokens"
            min="2000"
            max="48000"
            step="1000"
            value="{{ max_tokens }}"
            oninput="document.getElementById('token-display').innerText = Number(this.value).toLocaleString() + ' tokens'; updateTokenEstimate();"
            class="w-full h-2 bg-slate-200 dark:bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500"
          >
          <div class="flex justify-between text-[10px] text-slate-400 mt-1 font-mono">
            <span>2k</span>
            <span>16k</span>
            <span>48k</span>
          </div>
        </div>

        <div class="space-y-2.5 pt-2 border-t border-slate-100 dark:border-slate-800">
          <label class="flex items-center space-x-2.5 cursor-pointer text-xs text-slate-700 dark:text-slate-300">
            <input type="checkbox" name="include_toc" value="true" checked class="h-4 w-4 rounded border-slate-300 dark:border-slate-700 text-indigo-600">
            <span>Incluir tabla de contenidos</span>
          </label>
          <label class="flex items-center space-x-2.5 cursor-pointer text-xs text-slate-700 dark:text-slate-300">
            <input type="checkbox" name="include_guidelines" value="true" checked class="h-4 w-4 rounded border-slate-300 dark:border-slate-700 text-indigo-600">
            <span>Agregar directivas de verificación</span>
          </label>
        </div>

        <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
          <button
            type="submit"
            id="cf-compile-submit"
            class="w-full inline-flex items-center justify-center space-x-2 px-4 py-2.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl shadow-sm shadow-indigo-600/25 transition cursor-pointer"
          >
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <span>Compilar Context Bundle</span>
          </button>
        </div>
      </div>

<div
  class="relative"
  x-data="cfComboboxApp()"
  @click.outside="open = false"
  @keydown.escape.window="open = false"
>
  <script type="application/json" data-cf-combo-config>
    {
      "mode": "form",
      "selected": {{ active_project | tojson }},
      "options": [
        {% for p in projects %}
        {"value": {{ p.slug | tojson }}, "label": {{ (p.name ~ ' (' ~ p.slug ~ ')') | tojson }}}{% if not loop.last %},{% endif %}
        {% endfor %}
      ]
    }
  </script>

  <form x-ref="comboForm" method="POST" action="/ui/projects/switch" class="m-0">
    <input x-ref="valueInput" type="hidden" name="project_slug" :value="selected">
  </form>

  <button
    type="button"
    id="global-project-select"
    @click="toggle()"
    aria-label="Seleccionar proyecto activo"
    class="w-full px-2.5 py-1.5 rounded-xl bg-white dark:bg-[#161922] border border-slate-200 dark:border-[#232738] hover:border-indigo-500/50 text-xs font-medium text-slate-800 dark:text-zinc-100 flex items-center justify-between gap-2 transition cursor-pointer shadow-xs"
  >
    <span class="truncate" x-text="activeLabel"></span>
    <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform shrink-0" :class="{ 'rotate-180': open }"></i>
  </button>

  <div
    x-show="open"
    x-transition
    style="display: none;"
    class="absolute left-0 right-0 z-50 mt-1.5 rounded-xl bg-white dark:bg-[#0d0f17] border border-slate-200 dark:border-[#232738] shadow-xl p-2 space-y-1.5"
  >
    <div class="relative">
      <input
        type="text"
        x-ref="comboSearch"
        x-model="search"
        placeholder="Buscar proyecto..."
        class="w-full pl-7 pr-2.5 py-1.5 rounded-lg bg-slate-50 dark:bg-[#161922] border border-slate-200 dark:border-[#232738] text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-indigo-500"
      >
      <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2 text-[10px] text-slate-400 pointer-events-none"></i>
    </div>

    <div class="max-h-48 overflow-y-auto space-y-0.5 custom-scrollbar">
      <template x-for="opt in filteredOptions" :key="opt.value">
        <button
          type="button"
          @click="pick(opt.value)"
          :class="opt.value === selected ? 'bg-indigo-50 dark:bg-indigo-600/25 text-indigo-700 dark:text-indigo-200 font-semibold' : 'text-slate-700 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-[#1c202d]'"
          class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs flex items-center justify-between gap-2 transition cursor-pointer"
        >
          <span class="truncate" x-text="opt.label"></span>
          <i x-show="opt.value === selected" class="fa-solid fa-check text-indigo-500 text-[10px] shrink-0"></i>
        </button>
      </template>
      <template x-if="filteredOptions.length === 0">
        <div class="px-2.5 py-2 text-[11px] text-slate-400 italic text-center">Sin coincidencias</div>
      </template>
    </div>
  </div>
</div>

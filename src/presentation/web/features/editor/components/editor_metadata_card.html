  <!-- Progressive-Disclosure Metadata Bar (Title & Module always visible; Project/Tags/Summary collapsible) -->
  <div class="bg-white dark:bg-[#12151e] p-4 rounded-2xl border border-slate-200 dark:border-[#232738] shadow-xs space-y-3">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">

      <!-- 1. Title Input (Primary Focus) -->
      <div class="md:col-span-6">
        <label class="block text-xs font-medium text-slate-700 dark:text-zinc-300 mb-1">Título del documento *</label>
        <input
          type="text"
          x-model="doc.title"
          @input="markDirty()"
          placeholder="ej. Política de Reintentos en Webhooks"
          required
          class="w-full px-3 py-2 bg-slate-50 dark:bg-[#0c0e14] border border-slate-200 dark:border-[#232738] rounded-xl text-sm text-slate-900 dark:text-white font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500/50 shadow-xs"
        >
      </div>

      <!-- 2. Module Selection Combobox -->
      <div class="md:col-span-4 relative" @click.outside="moduleOpen = false">
        <label class="block text-xs font-medium text-slate-700 dark:text-zinc-300 mb-1">
          <i class="fa-solid fa-layer-group text-indigo-500 dark:text-indigo-400 mr-1"></i>Módulo *
        </label>
        <button
          type="button"
          @click="moduleOpen = !moduleOpen; if(moduleOpen) $nextTick(() => $refs.modInput?.focus())"
          class="w-full px-3 py-2 bg-slate-50 dark:bg-[#0c0e14] border border-slate-200 dark:border-[#232738] hover:border-indigo-500/50 rounded-xl text-xs text-slate-900 dark:text-white flex items-center justify-between cursor-pointer transition font-mono shadow-xs"
        >
          <div class="flex items-center gap-2 truncate">
            <span class="font-semibold text-indigo-600 dark:text-indigo-300 capitalize truncate" x-text="doc.module"></span>
            <span class="text-[10px] text-slate-500 dark:text-zinc-400 truncate" x-text="`(${getModuleName(doc.module)})`"></span>
          </div>
          <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 dark:text-zinc-400 transition-transform" :class="{ 'rotate-180': moduleOpen }"></i>
        </button>

        <div
          x-show="moduleOpen"
          x-transition
          class="absolute left-0 z-50 mt-1.5 w-full min-w-[250px] rounded-xl bg-white dark:bg-[#0d0f17] border border-slate-200 dark:border-zinc-800 shadow-xl p-2 space-y-1.5 backdrop-blur-xl"
          style="display: none;"
        >
          <div class="relative">
            <input
              type="text"
              x-ref="modInput"
              x-model="moduleSearch"
              placeholder="Buscar o crear módulo..."
              @keydown.enter.prevent="addCustomModule(); markDirty()"
              class="w-full pl-7 pr-3 py-1 bg-slate-50 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700/80 rounded-lg text-xs text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-indigo-500"
            >
            <i class="fa-solid fa-magnifying-glass absolute left-2 top-2 text-[10px] text-slate-400 pointer-events-none"></i>
          </div>

          <div class="max-h-44 overflow-y-auto space-y-1 custom-scrollbar">
            <template x-for="m in filteredModules()" :key="m.slug">
              <div
                @click="selectModule(m.slug); markDirty()"
                class="px-2.5 py-1.5 rounded-lg text-xs flex items-center justify-between cursor-pointer transition select-none"
                :class="doc.module === m.slug ? 'bg-indigo-50 dark:bg-indigo-600/30 text-indigo-900 dark:text-white font-semibold' : 'text-slate-700 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800'"
              >
                <div class="flex items-center gap-2 truncate">
                  <i :class="`fa-solid ${m.icon || 'fa-folder'} text-indigo-500 dark:text-indigo-400 text-xs`"></i>
                  <span class="font-medium truncate" x-text="m.name"></span>
                </div>
                <i x-show="doc.module === m.slug" class="fa-solid fa-check text-indigo-500 text-xs"></i>
              </div>
            </template>

            <template x-if="moduleSearch.trim() && !availableModules.some(m => m.slug === moduleSearch.trim().toLowerCase())">
              <div
                @click="addCustomModule(); markDirty()"
                class="px-2.5 py-1.5 rounded-lg text-xs text-indigo-600 dark:text-indigo-300 hover:bg-indigo-50 dark:hover:bg-indigo-600/20 cursor-pointer flex items-center gap-2 border border-indigo-300 dark:border-indigo-500/30 border-dashed"
              >
                <i class="fa-solid fa-plus text-xs"></i>
                <span>Crear "<strong x-text="moduleSearch.trim()"></strong>"</span>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- 3. Progressive Disclosure Toggle for Secondary Properties -->
      <div class="md:col-span-2">
        <button
          type="button"
          @click="showAdvancedMeta = !showAdvancedMeta"
          class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-[#232738] bg-slate-50 dark:bg-[#0c0e14] hover:border-indigo-500/50 text-xs font-medium text-slate-600 dark:text-zinc-300 flex items-center justify-between transition cursor-pointer"
        >
          <span class="flex items-center gap-1.5 truncate">
            <i class="fa-solid fa-sliders text-[10px] text-indigo-500"></i>
            <span>Propiedades</span>
            <span x-show="doc.tags.length > 0" class="px-1.5 py-0.2 rounded-full bg-indigo-500/15 text-indigo-600 dark:text-indigo-300 font-mono text-[10px]" x-text="doc.tags.length"></span>
          </span>
          <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 transition-transform" :class="{ 'rotate-180': showAdvancedMeta }"></i>
        </button>
      </div>
    </div>

    <!-- Collapsible Secondary Metadata: Project, Tags, Executive Summary -->
    <div x-show="showAdvancedMeta" x-transition class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-3 border-t border-slate-100 dark:border-[#1e2235]" style="display: none;">

      <!-- Project Selector -->
      <div class="relative" @click.outside="projectOpen = false">
        <label class="block text-xs font-medium text-slate-700 dark:text-zinc-300 mb-1">Proyecto destino</label>
        <button
          type="button"
          @click="projectOpen = !projectOpen; if(projectOpen) $nextTick(() => $refs.projInput?.focus())"
          class="w-full px-3 py-2 bg-slate-50 dark:bg-[#0c0e14] border border-slate-200 dark:border-[#232738] hover:border-indigo-500/50 rounded-xl text-xs text-slate-900 dark:text-white flex items-center justify-between cursor-pointer transition"
        >
          <span class="truncate font-medium" x-text="`${getProjectName(doc.library_id)} (${doc.library_id})`"></span>
          <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
        </button>

        <div
          x-show="projectOpen"
          x-transition
          class="absolute left-0 z-50 mt-1.5 w-full rounded-xl bg-white dark:bg-[#0d0f17] border border-slate-200 dark:border-zinc-800 shadow-xl p-2 space-y-1.5"
          style="display: none;"
        >
          <input type="text" x-ref="projInput" x-model="projectSearch" placeholder="Buscar proyecto..." class="w-full px-2.5 py-1 bg-slate-50 dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 rounded-lg text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
          <div class="max-h-36 overflow-y-auto space-y-1 custom-scrollbar">
            <template x-for="p in filteredProjects()" :key="p.slug">
              <div @click="selectProject(p.slug); markDirty()" class="px-2.5 py-1.5 rounded-lg text-xs flex items-center justify-between cursor-pointer hover:bg-slate-100 dark:hover:bg-zinc-800" :class="doc.library_id === p.slug ? 'bg-indigo-50 dark:bg-indigo-600/30 font-semibold' : ''">
                <span class="truncate" x-text="`${p.name} (${p.slug})`"></span>
                <i x-show="doc.library_id === p.slug" class="fa-solid fa-check text-indigo-500 text-xs"></i>
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Multi-select Tags -->
      <div class="relative" @click.outside="tagOpen = false">
        <label class="block text-xs font-medium text-slate-700 dark:text-zinc-300 mb-1">Etiquetas</label>
        <div @click="tagOpen = true; $refs.tagInputField?.focus()" class="min-h-[36px] p-1.5 bg-slate-50 dark:bg-[#0c0e14] border border-slate-200 dark:border-[#232738] rounded-xl text-xs flex flex-wrap items-center gap-1.5 cursor-text">
          <template x-for="t in doc.tags" :key="t">
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-mono bg-indigo-50 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-500/30">
              <span x-text="`#${t}`"></span>
              <button type="button" @click.stop="removeTag(t); markDirty()" class="hover:text-rose-500 cursor-pointer"><i class="fa-solid fa-xmark text-[9px]"></i></button>
            </span>
          </template>
          <input type="text" x-ref="tagInputField" x-model="tagSearch" @keydown.enter.prevent="addCustomTag(); markDirty()" @keydown.backspace="if(!tagSearch && doc.tags.length) { removeTag(doc.tags[doc.tags.length-1]); markDirty(); }" placeholder="Agregar etiqueta..." class="flex-1 min-w-[80px] bg-transparent border-none text-xs text-slate-900 dark:text-white focus:outline-none px-1 font-mono">
        </div>

        <div x-show="tagOpen" x-transition class="absolute left-0 z-50 mt-1.5 w-full rounded-xl bg-white dark:bg-[#0d0f17] border border-slate-200 dark:border-zinc-800 shadow-xl p-2 space-y-1.5" style="display: none;">
          <div class="max-h-40 overflow-y-auto space-y-1 custom-scrollbar">
            <template x-for="t in filteredTags()" :key="t.slug">
              <div @click="toggleTag(t.slug); markDirty()" class="px-2.5 py-1.5 rounded-lg text-xs flex items-center justify-between cursor-pointer hover:bg-slate-100 dark:hover:bg-zinc-800" :class="doc.tags.includes(t.slug) ? 'bg-indigo-50 dark:bg-indigo-600/25 font-semibold' : ''">
                <span x-text="`#${t.slug}`" class="font-mono"></span>
                <i x-show="doc.tags.includes(t.slug)" class="fa-solid fa-check text-indigo-500 text-xs"></i>
              </div>
            </template>
            <template x-if="tagSearch.trim() && !availableTags.some(t => t.slug === tagSearch.trim().toLowerCase())">
              <div @click="addCustomTag(); markDirty()" class="px-2.5 py-1.5 rounded-lg text-xs text-indigo-600 dark:text-indigo-300 cursor-pointer border border-dashed border-indigo-400/50">
                <i class="fa-solid fa-plus mr-1"></i>Crear "#<span x-text="tagSearch.trim()"></span>"
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- Summary -->
      <div>
        <label class="block text-xs font-medium text-slate-700 dark:text-zinc-300 mb-1">Resumen corto</label>
        <input type="text" x-model="doc.description" @input="markDirty()" placeholder="Propósito principal de este documento..." class="w-full px-3 py-2 bg-slate-50 dark:bg-[#0c0e14] border border-slate-200 dark:border-[#232738] rounded-xl text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
      </div>
    </div>
  </div>

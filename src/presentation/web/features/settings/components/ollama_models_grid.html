{% if ollama_models %}
<div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-5 space-y-3 shadow-xs">
  <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Modelos detectados en Ollama Local</h3>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
    {% for m in ollama_models %}
    <div class="p-3 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950/60 flex items-center justify-between text-xs">
      <span class="font-mono font-semibold text-slate-800 dark:text-white truncate">{{ m.name }}</span>
      <button type="button" data-model="{{ m.name }}" @click="getCurrentConfig().default_model = $el.dataset.model; saveConfig(getCurrentConfig())" class="px-2 py-1 rounded-lg bg-indigo-600 text-white text-[10px] font-semibold cursor-pointer">Usar</button>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}

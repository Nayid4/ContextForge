<!DOCTYPE html>
<html lang="es" class="h-full dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar contraseña | ContextForge</title>
  <script>
    (function() {
      const saved = localStorage.getItem('contextforge_theme') || 'dark';
      document.documentElement.classList.toggle('dark', saved !== 'light');
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' };</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-50 dark:bg-[#0a0b10] text-slate-900 dark:text-zinc-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md rounded-2xl border border-slate-200 dark:border-[#1e2235] bg-white dark:bg-[#11131a] p-7 shadow-xl space-y-6">
    <div class="space-y-1">
      <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-700 dark:text-amber-300 border border-amber-500/30 text-[11px] font-semibold">
        <i class="fa-solid fa-key"></i>
        <span>Cambio de contraseña obligatorio</span>
      </div>
      <h1 class="text-lg font-bold text-slate-900 dark:text-white pt-1">Actualiza tu contraseña</h1>
      <p class="text-xs text-slate-500 dark:text-zinc-400">
        Por seguridad, debes reemplazar la contraseña temporal antes de acceder a los documentos y agentes del equipo. Mínimo 8 caracteres.
      </p>
    </div>

    <div id="cp-error" role="alert" aria-live="assertive" class="hidden rounded-xl border border-rose-500/40 bg-rose-50 dark:bg-rose-950/40 p-3 text-xs text-rose-700 dark:text-rose-200"></div>

    <form id="cf-cp-form" class="space-y-4" novalidate>
      <div>
        <label for="cp-current" class="block text-xs font-semibold text-slate-700 dark:text-zinc-300 mb-1.5">Contraseña actual</label>
        <input id="cp-current" type="password" autocomplete="current-password" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-[#161922] border border-slate-300 dark:border-[#232738] text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label for="cp-new" class="block text-xs font-semibold text-slate-700 dark:text-zinc-300 mb-1.5">Nueva contraseña (mín. 8 caracteres)</label>
        <input id="cp-new" type="password" autocomplete="new-password" minlength="8" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-[#161922] border border-slate-300 dark:border-[#232738] text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label for="cp-confirm" class="block text-xs font-semibold text-slate-700 dark:text-zinc-300 mb-1.5">Confirmar nueva contraseña</label>
        <input id="cp-confirm" type="password" autocomplete="new-password" minlength="8" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-[#161922] border border-slate-300 dark:border-[#232738] text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button id="cp-submit" type="submit" class="w-full py-2.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-sm font-semibold shadow-sm transition cursor-pointer">
        Guardar nueva contraseña y continuar
      </button>
    </form>
  </main>

  <script>
    document.getElementById('cf-cp-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errBox = document.getElementById('cp-error');
      const btn = document.getElementById('cp-submit');
      const current_password = document.getElementById('cp-current').value;
      const new_password = document.getElementById('cp-new').value;
      const confirm = document.getElementById('cp-confirm').value;

      errBox.classList.add('hidden');
      if (new_password.length < 8) {
        errBox.textContent = 'La nueva contraseña debe tener al menos 8 caracteres.';
        errBox.classList.remove('hidden');
        return;
      }
      if (new_password !== confirm) {
        errBox.textContent = 'La confirmación no coincide con la nueva contraseña.';
        errBox.classList.remove('hidden');
        return;
      }
      btn.disabled = true;
      try {
        const res = await fetch('/api/v1/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ current_password, new_password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          errBox.textContent = data.detail || 'No se pudo actualizar la contraseña.';
          errBox.classList.remove('hidden');
          return;
        }
        window.location.href = '/docs/browser';
      } catch {
        errBox.textContent = 'Error de red actualizando la contraseña.';
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

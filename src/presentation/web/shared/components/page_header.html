{# Reusable Page Header Macro #}
{% macro page_header(icon_class, title, subtitle, badge_text="", accent="indigo") %}
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-4">
  <div class="flex items-center space-x-3.5 min-w-0">
    <span class="w-10 h-10 rounded-xl bg-{{ accent }}-500/10 border border-{{ accent }}-500/20 flex items-center justify-center text-{{ accent }}-600 dark:text-{{ accent }}-400 shrink-0 shadow-xs">
      <i class="{{ icon_class }} text-base"></i>
    </span>
    <div class="min-w-0">
      <div class="flex items-center gap-2.5 flex-wrap">
        <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white leading-tight">{{ title }}</h1>
        {% if badge_text %}
        <span class="px-2 py-0.5 rounded-md text-[11px] font-mono font-semibold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700">
          {{ badge_text }}
        </span>
        {% endif %}
      </div>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{{ subtitle }}</p>
    </div>
  </div>
  {% if caller %}
  <div class="flex items-center gap-2 flex-wrap shrink-0">
    {{ caller() }}
  </div>
  {% endif %}
</div>
{% endmacro %}

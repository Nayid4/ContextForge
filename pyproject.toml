[project]
name = "contextforge"
version = "0.1.0"
description = "ContextForge - Local Knowledge RAG & Context Builder (Docs-as-Code)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.2",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "python-frontmatter>=1.1.0",
    "marko>=2.1.2",
    "tiktoken>=0.8.0",
    "aiosqlite>=0.20.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "aiofiles>=24.1.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
    "watchdog>=6.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
mypy_path = "src"
explicit_package_bases = true
